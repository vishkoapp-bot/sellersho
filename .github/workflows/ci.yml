# TEST-02 release gate.
#
# What runs here:
#   frontend        — npm run build + npm test (all 53 frontend suites, incl. the
#                     puppeteer browser suites; ubuntu-latest is non-root, so Chromium launches).
#   go-unit         — go vet + the default Go suite. DB tests SKIP without opt-in
#                     credentials (TEST-01 guards); this job proves the pure-unit baseline.
#   go-integration  — per-package disposable migrated integration jobs via
#                     scripts/test-isolated.py (TEST-01). One fresh Docker PostgreSQL 16 +
#                     Redis 7 per package; the runner scrubs inherited credentials and
#                     refuses non-disposable targets, so this workflow cannot reach
#                     production addresses. No prod secret is present in this file.
#   go-race         — go test -race on pure-unit concurrency packages + focused -race
#                     on the repository concurrency invariants, via the isolated runner.
#   ci-self-test    — NEGATIVE CONTROL: proves the gate fails when it must. A scratch
#                     copy with the FIN-012 discount floor removed must fail the pricing
#                     suite, and a scratch copy with a broken migration must fail provisioning.
#                     The checked-out tree is never mutated.
#   release           — REL-01: build a staged release from git archive
#                     (make_release.sh), validate it (manifest, checksums,
#                     VITE allow-list, contract, exclusions, payment mode),
#                     run the VITE + planted-.env.local negative controls,
#                     the --production negative control (mock-mode release
#                     must fail production validation, N7) and the
#                     --db-url classification controls against the
#                     service Postgres (unmigrated DB must fail,
#                     migrated DB must pass, N5/N7), then run the
#                     smoke suite against disposable
#                     Postgres 16 + Redis 7 services. Node 24 / Go 1.27
#                     are the canonical release toolchain (G7).
#   deps            — govulncheck (Go, fails on any affecting-code vulnerability) +
#                     npm audit --audit-level=high.
#
# Lockfile note: pnpm install runs WITHOUT --frozen-lockfile on purpose. The committed
# pnpm-lock.yaml is stale relative to package.json (it predates the puppeteer
# devDependency; see TEST-02 audit §7 / fix report F-UP-1). A frozen install would fail
# on that pre-existing drift, not on this change. Regenerate the lockfile on a machine
# where pnpm can write it, then switch this step to --frozen-lockfile.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: frontend build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@10.34.2 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec puppeteer browsers install chrome
      - run: npm run build
      - run: npm test

  go-unit:
    name: go vet + default unit suite (no DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - working-directory: backend
        run: go vet $(go list ./... | grep -v networkreward)
      - working-directory: backend
        # No *_DATABASE_URL is set: DB-backed tests skip by TEST-01 design.
        # A failure here is a real unit failure, never a missing-DB failure.
        run: go test $(go list ./... | grep -v networkreward) -count=1

  go-integration:
    name: go integration (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package:
          - ./cmd/capacity-fixture
          - ./cmd/migrate
          - ./cmd/redis-recover
          - ./cmd/seed
          - ./cmd/server
          - ./internal/accesspolicy
          - ./internal/adguard
          - ./internal/auth
          - ./internal/bank
          - ./internal/catalogpage
          - ./internal/catalogpricing
          - ./internal/config
          - ./internal/customdomain
          - ./internal/database/seeder
          - ./internal/dependencybudget
          - ./internal/domain
          - ./internal/ippanel
          - ./internal/jobrunner
          - ./internal/lifecycle
          - ./internal/migrations
          - ./internal/observability
          - ./internal/payment
          - ./internal/phone
          - ./internal/pricing
          - ./internal/privacy
          - ./internal/repository
          - ./internal/requestbudget
          - ./internal/routing
          - ./internal/shippingquote
          - ./internal/tapin
          - ./internal/testdb
          - ./internal/testredis
          - ./internal/warehouseopt
          - ./internal/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run package tests and independently validate the canonical schema
        env:
          TEST_PACKAGE: ${{ matrix.package }}
        run: |
          # Some compatibility suites intentionally rebuild legacy tables;
          # these schema-sensitive checks must observe canonical migrations,
          # not the shadow schema left by those fixtures. Both runs gate CI.
          case "$TEST_PACKAGE" in
            ./cmd/server)
              schema_groups=('TestQUAL01WarehouseAssignmentAndSelf|TestWarehouseNotificationsReadPath') ;;
            ./internal/repository)
              # Historical downgrade rehearsals each need a fresh database:
              # the down scripts correctly refuse other tests' retained evidence.
              schema_groups=(
                TestFIN007CreationFKCatalog
                TestINV06ReturnBinMigrationPreservesExistingPlacement
                TestINV09MigrationPreservesHistoricalExceptions
                TestFIN003MigrationPreservesHistoricalCancelledPaidRecords
                TestFIN003LegacyPendingRefundTableClaimIsNotSpentAgain
                TestFIN003LegacyPSPRefundTableClaimIsNotSpentAgain
                TestFIN003LegacyCompletedRefundProjectionsAreNotDoubleCounted
                TestFIN006MigrationPreservesUnknownHistoryWithoutInventingDebt
              ) ;;
            *)
              schema_groups=() ;;
          esac
          run_isolated() {
            python scripts/test-isolated.py -- go test "$TEST_PACKAGE" -count=1 -timeout 9m -v "$@"
          }
          if (( ${#schema_groups[@]} == 0 )); then
            run_isolated
          else
            result=0
            skipped="$(IFS='|'; printf '%s' "${schema_groups[*]}")"
            run_isolated -skip "^($skipped)$" || result=1
            for group in "${schema_groups[@]}"; do
              run_isolated -run "^($group)$" || result=1
            done
            exit "$result"
          fi

  go-race:
    name: go race on concurrency invariants
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: backend
        run: go test -race ./internal/pricing/ ./internal/catalogpage/ ./internal/catalogpricing/ -count=1
      - run: >-
          python scripts/test-isolated.py -- go test -race ./internal/repository
          -run 'TestFIN007LastUse100|TestFinanceBalanceConcurrentDebits|TestFinanceBalanceConcurrentRefundAndIndependentDebits|TestSKUInventoryConcurrentLastUnitOnlyOneCapture|TestParcelChargeConcurrent|TestINV06ConcurrentDeparturesPreserveRoundingAndPermitRefill'
          -count=1 -timeout 9m -v

  ci-self-test:
    name: negative control (gate must fail on a broken invariant/migration)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: broken invariant must fail the suite
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/mutation-invariant"
          cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/mutation-invariant"
          cd "$RUNNER_TEMP/mutation-invariant/backend"
          # Remove the FIN-012 floor from the campaign path only: a 30% campaign
          # must then price below base cost, and TestCampaignNeverRaisesPrice must fail.
          python3 - <<'PYEOF'
          p = 'internal/pricing/discount.go'
          s = open(p, encoding='utf-8').read()
          old = "final, err := DiscountedPrice(res.FinalPrice, res.BaseCost, c.Mode, c.Value)"
          assert s.count(old) == 2
          open(p, 'w', encoding='utf-8').write(s.replace(old, "final, err := DiscountedPrice(res.FinalPrice, 0, c.Mode, c.Value)", 1))
          PYEOF
          if go test ./internal/pricing/ -run 'TestCampaignNeverRaisesPrice' -count=1; then
            echo "NEGATIVE CONTROL FAILED: suite stayed green with the discount floor removed"
            exit 1
          fi
          echo "negative control 1 OK: broken invariant fails the suite"
      - name: broken migration must fail provisioning
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/mutation-migration"
          cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/mutation-migration"
          printf 'THIS IS NOT SQL;\n' > "$RUNNER_TEMP/mutation-migration/backend/migrations/999999999999_test02_negative.up.sql"
          cd "$RUNNER_TEMP/mutation-migration"
          if python scripts/test-isolated.py -- go test ./internal/pricing/ -count=1; then
            echo "NEGATIVE CONTROL FAILED: broken migration did not fail provisioning"
            exit 1
          fi
          echo "negative control 2 OK: broken migration fails provisioning"
      - name: workflow cannot reach production addresses
        run: |
          # No production host, domain, or credential-bearing URL may appear here.
          # The guard's own line is excluded from the scan (grep -v):
          # the pattern text itself contains the forbidden literals,
          # so scanning it would self-match and the step could never
          # pass (as on main before this fix).
          if grep -v -F "grep -rE" .github/workflows/ci.yml | grep -E '46\.249\.98\.190|sellershow\.ir|40kaman\.com|postgres://[^t]|DATABASE_URL=.+@'; then
            echo "production address found in the CI workflow"
            exit 1
          fi
          echo "no production address in the CI workflow"

  deps:
    name: dependency vulnerability triage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@10.34.2 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - run: npm audit --audit-level=high

  release:
    name: release build + validate + smoke (REL-01)
    # Ubuntu 26.04 does not ship postgresql-client-16 in its default apt sources.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: smoke-ci-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install psql + redis-cli for the smoke suite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 redis-tools
      - name: build a staged release from git archive
        # Validate a real-mode release artifact; smoke injects the mock provider
        # into the disposable running process and never uses real credentials.
        run: bash scripts/release/make_release.sh --payment-mode real --production
      - name: VITE negative control — ambient VITE_USE_MOCK must fail the build
        run: |
          if VITE_USE_MOCK=true bash scripts/release/make_release.sh --payment-mode mock --out-dir "$RUNNER_TEMP/vite-negative"; then
            echo "NEGATIVE CONTROL FAILED: release built with VITE_USE_MOCK=true in the environment"
            exit 1
          fi
          echo "negative control OK: VITE_USE_MOCK=true fails the release build"
      - name: planted-.env.local negative control — dirty stage must fail validation
        run: |
          set -e
          COMMIT="$(git rev-parse HEAD)"
          rm -rf "$RUNNER_TEMP/planted-env"
          cp -a "releases/$COMMIT" "$RUNNER_TEMP/planted-env"
          printf 'VITE_USE_MOCK=true\n' > "$RUNNER_TEMP/planted-env/.env.local"
          if python3 scripts/release/validate_release.py --stage "$RUNNER_TEMP/planted-env" --commit "$COMMIT"; then
            echo "NEGATIVE CONTROL FAILED: validation passed a stage with a planted .env.local"
            exit 1
          fi
          echo "negative control OK: planted .env.local fails validation"
      - name: --production negative control — mock-mode release must fail production validation (N7)
        run: |
          COMMIT="$(git rev-parse HEAD)"
          MOCK_STAGE="$RUNNER_TEMP/mock-mode-release"
          bash scripts/release/make_release.sh --payment-mode mock --out-dir "$MOCK_STAGE"
          if python3 scripts/release/validate_release.py --stage "$MOCK_STAGE" --commit "$COMMIT" --production; then
            echo "NEGATIVE CONTROL FAILED: mock-mode release passed --production validation"
            exit 1
          fi
          echo "negative control OK: mock-mode release fails --production validation"
      - name: --db-url classification against service Postgres (N5/N7)
        env:
          PGPASSWORD: smoke-ci-password
        run: |
          set -e
          COMMIT="$(git rev-parse HEAD)"
          # The URL is assembled at runtime (never written literally):
          # this workflow's own ci-self-test guard forbids a literal
          # credential-bearing postgres URL in the file. It points only at the
          # disposable service Postgres on localhost; the password is
          # the same disposable service password already declared
          # above for the postgres service.
          DB_URL="$(printf '%s://%s:%s@%s:%s/%s' postgres postgres "$PGPASSWORD" localhost 5432 rel01_dburl)"
          ADMIN_URL="$(printf '%s://%s:%s@%s:%s/%s' postgres postgres "$PGPASSWORD" localhost 5432 postgres)"
          psql "$ADMIN_URL" -c "DROP DATABASE IF EXISTS rel01_dburl;" -c "CREATE DATABASE rel01_dburl;"
          # Negative control: an unmigrated DB (empty schema_migrations
          # table, all 210 migrations pending, unreviewed historical)
          # must FAIL with --db-required.
          psql "$DB_URL" -c "CREATE TABLE schema_migrations (version text PRIMARY KEY);"
          if python3 scripts/release/validate_release.py --stage "releases/$COMMIT" --commit "$COMMIT" --db-url "$DB_URL" --db-required; then
            echo "NEGATIVE CONTROL FAILED: validation passed an unmigrated DB with --db-url"
            exit 1
          fi
          echo "negative control OK: unmigrated DB fails --db-url --db-required validation"
          # Positive control: apply the staged migrations with the
          # staged migrate binary, then classification must pass
          # (0 pending) with --db-required.
          psql "$ADMIN_URL" -c "DROP DATABASE rel01_dburl;" -c "CREATE DATABASE rel01_dburl;"
          DATABASE_URL="$DB_URL" "releases/$COMMIT/backend/bin/migrate-linux" -db "$DB_URL" -dir "releases/$COMMIT/backend/migrations"
          python3 scripts/release/validate_release.py --stage "releases/$COMMIT" --commit "$COMMIT" --db-url "$DB_URL" --db-required
          echo "--db-url classification OK: 0 pending after staged migrate"
          psql "$ADMIN_URL" -c "DROP DATABASE IF EXISTS rel01_dburl;"
      - name: smoke suite on disposable fixtures
        env:
          SMOKE_PG_HOST: localhost
          SMOKE_PG_PORT: "5432"
          SMOKE_PG_USER: postgres
          SMOKE_PG_PASSWORD: smoke-ci-password
          SMOKE_REDIS_URL: redis://localhost:6379/15
        run: |
          COMMIT="$(git rev-parse HEAD)"
          python3 scripts/release/smoke_release.py --stage "releases/$COMMIT"
      - name: smoke negative control — readiness probe must fail on a dead port
        run: python3 scripts/release/smoke_release.py --self-test-negative
