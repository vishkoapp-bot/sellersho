version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: drup_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drup_admin
      # SEC-01 (supervisor F-01): no literal password here - the dev
      # stack reads it from the host env. NOTE: existing dev volumes
      # were initialised with the retired dev password; after this
      # change either recreate the volume (`docker compose -f
      # backend/docker-compose.yml down -v`) or set
      # POSTGRES_PASSWORD to the password the volume was created
      # with. See DEV-WORKFLOW.md for the exact commands.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for the dev stack}"
      POSTGRES_DB: drup_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drup_admin -d drup_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drup_redis
    restart: unless-stopped
    # SEC-01 (supervisor F-01): no literal password in the command or
    # healthcheck argv - the value comes from the host env via
    # $$REDIS_PASSWORD (same pattern as docker-compose.prod.yml).
    # Same volume note as postgres above: recreate the redis volume
    # or set REDIS_PASSWORD to the password it was created with.
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD for the dev stack}"
    command: ["sh", "-ec", 'exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drup_go_api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      APP_ENV: "${APP_ENV:-development}"
      JWT_SECRET: "${JWT_SECRET}"
      TRACKING_WEBHOOK_SECRET: "${TRACKING_WEBHOOK_SECRET}"
      IPPANEL_ENABLED: "${IPPANEL_ENABLED:-false}"
      IPPANEL_BASE_URL: "${IPPANEL_BASE_URL:-https://edge.ippanel.com/v1}"
      IPPANEL_API_KEY: "${IPPANEL_API_KEY}"
      IPPANEL_SENDER: "${IPPANEL_SENDER}"
      IPPANEL_PATTERN_CODE: "${IPPANEL_PATTERN_CODE}"
    ports:
      - "8080:8080"
    volumes:
      - ./static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data:
