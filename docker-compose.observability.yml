# OBS-01 — collector stack, split out of docker-compose.prod.yml (C-02).
#
# WHY THIS FILE EXISTS: docker-compose.prod.yml used to declare these four
# services, including Grafana's
#   GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:? ...}"
# fail-fast. deploy_remote.py includes docker-compose.prod.yml in EVERY
# deploy (and in rollback), so an unset Grafana password aborted the NEXT
# DEPLOY OF ANY KIND — app hotfix, security fix, rollback — before anything
# was touched. On 2026-11-18 the password was unset on prod
# (grep -c GRAFANA_ADMIN_PASSWORD /opt/drup/.env == 0), so the OBS-01 push
# itself would have failed at its first step.
#
# This file is included ONLY by deploy_observability() in
# scripts/deploy_remote.py, never by the app deploy, never by rollback.
# An unset GRAFANA_ADMIN_PASSWORD now fails ONLY the collector deploy
# (which genuinely needs it), never an app deploy or a rollback. There is
# deliberately NO default password here: a ${VAR:-default} with a known
# default would be a published credential. Set GRAFANA_ADMIN_PASSWORD in
# /opt/drup/.env (mode 0600, server-only) before the first collector
# deploy.
#
# All four services run with host networking and bind loopback only, so
# every metrics/UI port is reachable from the prod host itself (and via
# SSH tunnel) and from nowhere else. Images are pinned; verify tags exist
# before changing them (Hub tags checked 2026-11-18). These services are
# NOT started by the app deploy's targeted `up backend/frontend/edge`;
# deploy_remote.py starts them explicitly in its observability step.
# Retention is explicitly bounded: prod disk was at 99% (310M free) on
# 2026-11-18. 3 days / 128MB — revisit only after the disk-pressure
# incident is cleared; never raise while near-full.
services:
  prometheus:
    # REL-02: digest pin added to the existing version pin (same
    # lineage v3.5.0 — the exact image running on prod 2026-11-20).
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    container_name: drup_prometheus
    restart: unless-stopped
    # REL-02 budgets (audit §4.1): bounded by 128 MB TSDB retention.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # REL-02 healthcheck (deploy_observability already polls /-/healthy
    # from the host; this makes it a container healthcheck too). wget
    # verified present and working in the live container 2026-11-20.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9091/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=128MB
      - --web.listen-address=127.0.0.1:9091
      # NOTE (C-09): --web.enable-lifecycle was REMOVED. It exposed POST
      # /-/quit (anyone reaching host loopback could shut Prometheus
      # down), and its only consumer — the deploy's POST /-/reload — is
      # redundant: deploy_observability() force-recreates this container,
      # so rules load from disk at startup. Do not re-add lifecycle
      # without a written reason and a loopback-only restriction.
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  grafana:
    # REL-02: digest pin added to the existing version pin (same
    # lineage 11.6.2 — the exact image running on prod 2026-11-20).
    image: grafana/grafana:11.6.2@sha256:a3464c5dadc2e16aaeb813aead8c852e81cc7bbfa851c66d96f016d5257b9848
    container_name: drup_grafana
    restart: unless-stopped
    # REL-02 budgets (audit §4.1): largest collector, idle 79 MB.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # REL-02 healthcheck (deploy_observability already polls /api/health
    # from the host; this makes it a container healthcheck too). wget
    # verified present in the live container 2026-11-20.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # COLLECTOR-DEPLOY PRECONDITION: set GRAFANA_ADMIN_PASSWORD in
      # /opt/drup/.env (mode 0600, server-only) before the first deploy
      # that includes this stack; compose config fails fast with this
      # message until it is set. Reach the UI via SSH tunnel to
      # http://127.0.0.1:3000 — never publish this port. Because this
      # file is only included by deploy_observability(), an unset
      # password blocks ONLY the collector deploy, never an app deploy
      # or a rollback (see the header of this file).
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in /opt/drup/.env}"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/dashboard.json:/etc/grafana/dashboards/sellersho-capacity.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  node-exporter:
    # REL-02: digest pin added to the existing version pin (same
    # lineage v1.9.1 — the exact image running on prod 2026-11-20).
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    container_name: drup_node_exporter
    restart: unless-stopped
    # REL-02 budgets (audit §4.1): trivial, idle 14 MB.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 256
        reservations:
          memory: 16M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # REL-02 healthcheck on /metrics (the exporter has no /-/healthy
    # endpoint worth probing; /metrics proves it scrapes). wget
    # verified present and working in the live container 2026-11-20.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  nginx-exporter:
    # REL-02: digest pin added to the existing version pin (same
    # lineage 1.5.3 — the exact image running on prod 2026-11-20).
    image: nginx/nginx-prometheus-exporter:1.5.3@sha256:85666e7fde7e253f1c6d978f9a961245df4c9cdb7677e1866d9bb28e8f9ee41d
    container_name: drup_nginx_exporter
    restart: unless-stopped
    # REL-02 budgets (audit §4.1): trivial, idle 18 MB.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 256
        reservations:
          memory: 16M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # REL-02: NO container healthcheck — this image is scratch-based:
    # no shell and no wget (verified live 2026-11-20: `docker exec`
    # fails with "executable file not found"). Its health is already
    # proven by deploy_observability(), which requires nginx_up == 1
    # from the scrape before the deploy may claim success. Do not add
    # a healthcheck here until the image ships a probe binary.
    network_mode: host
    command:
      - -nginx.scrape-uri=http://127.0.0.1:8081/status
      - -web.listen-address=127.0.0.1:9113
      - -web.telemetry-path=/metrics
    depends_on:
      - frontend

volumes:
  prometheus_data:
  grafana_data:
