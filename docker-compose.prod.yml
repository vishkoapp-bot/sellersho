services:
  postgres:
    image: postgres:16-alpine
    container_name: drup_postgres
    restart: always
    environment:
      POSTGRES_USER: drup_admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required runtime secret}"
      POSTGRES_DB: drup_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drup_admin -d drup_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drup_redis
    restart: always
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?required runtime secret}"
    command: ["sh", "-ec", 'exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: alpine:3.19
    container_name: drup_backend
    restart: always
    stop_grace_period: 30s
    working_dir: /app
    command: ["/app/server"]
    environment:
      PORT: "8080"
      STARTUP_TIMEOUT_SECONDS: "${STARTUP_TIMEOUT_SECONDS:-30}"
      SHUTDOWN_GRACE_SECONDS: "${SHUTDOWN_GRACE_SECONDS:-20}"
      APP_ENV: "production"
      PAYMENT_GATEWAY_MODE: "real"
      DATABASE_URL: "${DATABASE_URL:?required runtime secret}"
      REDIS_URL: "${REDIS_URL:?required runtime secret}"
      JWT_SECRET: "${JWT_SECRET:?required runtime secret}"
      TRACKING_WEBHOOK_SECRET: "${TRACKING_WEBHOOK_SECRET:?required runtime secret}"
      UPLOAD_DIR: "/app/static/uploads/products"
      DEMO_GATEWAY_ENABLED: "false"
      TAPIN_TOKEN_KEY: "${TAPIN_TOKEN_KEY:?required runtime secret}"
      TAPIN_TOKEN_PREVIOUS_KEY: "${TAPIN_TOKEN_PREVIOUS_KEY:-}"
      PSP_TERMINAL_ID: "${PSP_TERMINAL_ID:-}"
      PSP_API_KEY: "${PSP_API_KEY:-}"
      ALLOWED_ORIGINS: "http://46.249.98.190,https://46.249.98.190"
    ports:
      - "127.0.0.1:8080:8080"
      # OBS-01 (D-01/G-01): loopback-only publish of the backend's
      # metrics listener (now 0.0.0.0:9090 in-container — see
      # docs/operations/observability.md "Security-boundary move"; the
      # old 127.0.0.1 in-container bind was unreachable at the
      # container's eth0 IP, so the publish could never reach it) so
      # the host-networked Prometheus can scrape it. 127.0.0.1 only —
      # never a public port, never proxied through Caddy/nginx. The
      # checkpoint doc said "do not publish that port"; a shared-
      # namespace sidecar cannot work here because the three scrape
      # endpoints live in three different network namespaces
      # (backend :9090, edge :2019, frontend :8081), so the loopback
      # publish is the local-tunnel alternative the doc allows.
      - "127.0.0.1:9090:9090"
    volumes:
      - /opt/drup/backend/bin/server-linux:/app/server:ro
      - /opt/drup/backend/migrations:/app/migrations:ro
      - /opt/drup/static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: drup_frontend
    restart: always
    ports:
      - "80:80"
      # OBS-01 (D-01/D-08): loopback-only publish of nginx stub_status
      # (now `listen 8081` in-container — see
      # docs/operations/observability.md "Security-boundary move"; the
      # old 127.0.0.1:8081 in-container bind was unreachable at the
      # container's eth0 IP) so the host-networked
      # nginx-prometheus-exporter can read it. stub_status is
      # plain text, not Prometheus format — it is scraped by the exporter,
      # never directly by Prometheus.
      - "127.0.0.1:8081:8081"
    volumes:
      - /opt/drup/dist:/usr/share/nginx/html:ro
      - /opt/drup/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/drup/logs/nginx:/var/log/nginx
    depends_on:
      - backend

  # OBS-01 collector stack (Prometheus, Grafana, node-exporter,
  # nginx-exporter) lives in docker-compose.observability.yml (C-02), NOT
  # here: the Grafana admin-password fail-fast used to sit in this file,
  # and this file is included in EVERY deploy (and in rollback), so an
  # unset password aborted the next deploy of any kind. The observability
  # file is included ONLY by deploy_observability() in
  # scripts/deploy_remote.py — an unset password now blocks only the
  # collector deploy, never an app deploy or a rollback.

volumes:
  postgres_data:
  redis_data:
