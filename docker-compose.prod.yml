services:
  postgres:
    # REL-02: pinned to the exact image running on prod 2026-11-20.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: drup_postgres
    restart: always
    # REL-02 budgets (audit §4.1: idle 163 MB; limit = idle × headroom,
    # starting value to be confirmed by the 100-RPS rehearsal R-4).
    # Sum of all memory limits ≈ 3.1 GB < 3.9 GB host RAM by design.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
          pids: 256
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: drup_admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required runtime secret}"
      POSTGRES_DB: drup_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drup_admin -d drup_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # REL-02: pinned to the exact image running on prod 2026-11-20.
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: drup_redis
    restart: always
    # REL-02 budgets (audit §4.1): container limit 640M sits ABOVE the
    # 512M maxmemory so Redis eviction engages before an OOM-kill.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 640M
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?required runtime secret}"
    # PERF-04: explicit persistence/eviction/memory policy — AOF on, fsync
    # every second, never evict holds/OTP (noeviction), 512 MB ceiling.
    command: ["sh", "-ec", 'exec docker-entrypoint.sh redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # REL-02: pinned to the exact image running on prod 2026-11-20.
    image: alpine:3.19@sha256:6e68b5776ed76284bcb26fd9c627e7379c4ddc2e1db8519131044a82278466cf
    container_name: drup_backend
    restart: always
    stop_grace_period: 30s
    # REL-02 budgets (audit §4.1): idle 11 MB is NOT load behaviour —
    # 512M is a starting cap to be revised after the 100-RPS
    # measurement (R-4). No swap on the host: a breach OOM-kills, so
    # the limit must be validated under load BEFORE it is enforced.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
          pids: 512
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    working_dir: /app
    command: ["/app/server"]
    # REL-02 healthcheck (audit §4.3): /api/live is the OPS-01 cheap
    # liveness probe — it stays 200 during drain, so a draining
    # backend is not restarted. Never healthcheck /api/ready here: a
    # dependency blip would restart-loop the backend.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    environment:
      PORT: "8080"
      STARTUP_TIMEOUT_SECONDS: "${STARTUP_TIMEOUT_SECONDS:-30}"
      SHUTDOWN_GRACE_SECONDS: "${SHUTDOWN_GRACE_SECONDS:-20}"
      APP_ENV: "production"
      PAYMENT_GATEWAY_MODE: "real"
      DATABASE_URL: "${DATABASE_URL:?required runtime secret}"
      REDIS_URL: "${REDIS_URL:?required runtime secret}"
      JWT_SECRET: "${JWT_SECRET:?required runtime secret}"
      TRACKING_WEBHOOK_SECRET: "${TRACKING_WEBHOOK_SECRET:?required runtime secret}"
      UPLOAD_DIR: "/app/static/uploads/products"
      DEMO_GATEWAY_ENABLED: "false"
      # REL-02 reconciliation note: TAPIN_TOKEN_KEY stays `:?required`
      # (SEC-01 gate test_prod_uses_required_runtime_injection enforces
      # it). The key is ABSENT from /opt/drup/.env (verified 2026-11-20)
      # and lives only in the running backend container's env — so
      # deploy_remote.py exports it into the interpolation environment
      # from the live container (next to DOMAIN_EDGE_HOST below) before
      # `compose config` runs. If the live container ever lacks it, the
      # `:?` fails loudly instead of shipping an empty key.
      TAPIN_TOKEN_KEY: "${TAPIN_TOKEN_KEY:?required runtime secret}"
      TAPIN_TOKEN_PREVIOUS_KEY: "${TAPIN_TOKEN_PREVIOUS_KEY:-}"
      PSP_TERMINAL_ID: "${PSP_TERMINAL_ID:-}"
      PSP_API_KEY: "${PSP_API_KEY:-}"
      ALLOWED_ORIGINS: "http://46.249.98.190,https://46.249.98.190"
    ports:
      - "127.0.0.1:8080:8080"
      # OBS-01 (D-01/G-01): loopback-only publish of the backend's
      # metrics listener (now 0.0.0.0:9090 in-container — see
      # docs/operations/observability.md "Security-boundary move"; the
      # old 127.0.0.1 in-container bind was unreachable at the
      # container's eth0 IP, so the publish could never reach it) so
      # the host-networked Prometheus can scrape it. 127.0.0.1 only —
      # never a public port, never proxied through Caddy/nginx. The
      # checkpoint doc said "do not publish that port"; a shared-
      # namespace sidecar cannot work here because the three scrape
      # endpoints live in three different network namespaces
      # (backend :9090, edge :2019, frontend :8081), so the loopback
      # publish is the local-tunnel alternative the doc allows.
      - "127.0.0.1:9090:9090"
    volumes:
      - /opt/drup/backend/bin/server-linux:/app/server:ro
      - /opt/drup/backend/migrations:/app/migrations:ro
      - /opt/drup/static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    # REL-02: pinned to the exact image running on prod 2026-11-20
    # (live nginx 1.31.6; see the drift note in docker-compose.yml).
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    container_name: drup_frontend
    restart: always
    # REL-02: 30s grace aligns with the backend (OPS-01 drain ≤14s);
    # nginx SIGQUIT is graceful, the grace only bounds a stuck worker.
    stop_grace_period: 30s
    # REL-02 budgets (audit §4.1): static server, idle 5 MB.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 256
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # REL-02 healthcheck: proves nginx serves (nginx -t is config-only).
    # wget verified present in the live frontend container 2026-11-20.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    ports:
      - "80:80"
      # OBS-01 (D-01/D-08): loopback-only publish of nginx stub_status
      # (now `listen 8081` in-container — see
      # docs/operations/observability.md "Security-boundary move"; the
      # old 127.0.0.1:8081 in-container bind was unreachable at the
      # container's eth0 IP) so the host-networked
      # nginx-prometheus-exporter can read it. stub_status is
      # plain text, not Prometheus format — it is scraped by the exporter,
      # never directly by Prometheus.
      - "127.0.0.1:8081:8081"
    volumes:
      - /opt/drup/dist:/usr/share/nginx/html:ro
      - /opt/drup/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/drup/logs/nginx:/var/log/nginx
    # REL-02: health-gated — the frontend only starts once the backend
    # is live, instead of proxying to a dead backend and serving 502s.
    depends_on:
      backend:
        condition: service_healthy

  # OBS-01 collector stack (Prometheus, Grafana, node-exporter,
  # nginx-exporter) lives in docker-compose.observability.yml (C-02), NOT
  # here: the Grafana admin-password fail-fast used to sit in this file,
  # and this file is included in EVERY deploy (and in rollback), so an
  # unset password aborted the next deploy of any kind. The observability
  # file is included ONLY by deploy_observability() in
  # scripts/deploy_remote.py — an unset password now blocks only the
  # collector deploy, never an app deploy or a rollback.

volumes:
  postgres_data:
  redis_data:
