services:
  postgres:
    image: postgres:16-alpine
    container_name: drup_postgres
    restart: always
    environment:
      POSTGRES_USER: drup_admin
      POSTGRES_PASSWORD: drup_prod_secure_pass_4624998190
      POSTGRES_DB: drup_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drup_admin -d drup_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drup_redis
    restart: always
    command: ["redis-server", "--requirepass", "drup_prod_redis_pass_4624998190"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "drup_prod_redis_pass_4624998190", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: alpine:3.19
    container_name: drup_backend
    restart: always
    working_dir: /app
    command: ["/app/server"]
    environment:
      PORT: "8080"
      APP_ENV: "production"
      PAYMENT_GATEWAY_MODE: "real"
      DATABASE_URL: "postgres://drup_admin:${POSTGRES_PASSWORD}@postgres:5432/drup_db?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      JWT_SECRET: "drup_prod_jwt_secret_token_secure_32_chars_2026_xyz"
      TRACKING_WEBHOOK_SECRET: "drup_prod_webhook_secret_key_4624998190"
      UPLOAD_DIR: "/app/static/uploads/products"
      LOCAL_OTP_MODE: "false"
      TEST_OTP_NUMBERS: ""
      TEST_OTP_CODE: ""
      DEMO_GATEWAY_ENABLED: "false"
      TAPIN_TOKEN_KEY: "nQf8BTQXUGr8TI5FkETo7LCJKWWPQwTBNNQyLteJSEc="
      ALLOWED_ORIGINS: "http://46.249.98.190,https://46.249.98.190"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/drup/backend/bin/server-linux:/app/server:ro
      - /opt/drup/backend/migrations:/app/migrations:ro
      - /opt/drup/static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: drup_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - /opt/drup/dist:/usr/share/nginx/html:ro
      - /opt/drup/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/drup/logs/nginx:/var/log/nginx
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
