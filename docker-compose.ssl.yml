# Apply alongside docker-compose.prod.yml after configuring DNS and ACME_EMAIL.
services:
  backend:
    environment:
      DOMAIN_EDGE_HOST: "${DOMAIN_EDGE_HOST:?Set the public edge hostname or IP}"
      PLATFORM_DOMAINS: "${PLATFORM_DOMAINS:?Comma-separated primary platform hostnames}"
      TRUSTED_PROXY_CIDRS: "172.16.0.0/12,10.0.0.0/8"
  frontend:
    ports: !reset []
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: "${ACME_EMAIL:-}"
      PLATFORM_HTTP_HOST: "${PLATFORM_HTTP_HOST:-localhost}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # OBS-01 (D-01/D-08): loopback-only publish of the Caddy admin
      # endpoint (127.0.0.1:2019 inside the edge container) so the
      # host-networked Prometheus can scrape /metrics. 127.0.0.1 only —
      # the admin endpoint is a control API, never a public port.
      - "127.0.0.1:2019:2019"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
volumes:
  caddy_data:
  caddy_config:
