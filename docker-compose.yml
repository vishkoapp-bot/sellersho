services:
  postgres:
    # REL-02: pinned to the exact image running on prod 2026-11-20
    # (digest = live RepoDigest; re-confirm with `docker buildx imagetools
    # inspect` if the tag is ever re-pulled).
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: drup_postgres
    restart: unless-stopped
    logging: &rel02-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: drup_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: drup_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drup_admin -d drup_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # REL-02: pinned to the exact image running on prod 2026-11-20.
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: drup_redis
    restart: unless-stopped
    logging: *rel02-logging
    # PERF-04: explicit persistence/eviction/memory policy — AOF on, fsync
    # every second, never evict holds/OTP (noeviction), 512 MB ceiling.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drup_backend
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *rel02-logging
    environment:
      PORT: "8080"
      STARTUP_TIMEOUT_SECONDS: "${STARTUP_TIMEOUT_SECONDS:-30}"
      SHUTDOWN_GRACE_SECONDS: "${SHUTDOWN_GRACE_SECONDS:-20}"
      APP_ENV: "${APP_ENV:-production}"
      PAYMENT_GATEWAY_MODE: "${PAYMENT_GATEWAY_MODE:-real}"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      TRACKING_WEBHOOK_SECRET: "${TRACKING_WEBHOOK_SECRET}"
      UPLOAD_DIR: "${UPLOAD_DIR:-/app/static/uploads/products}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
      IPPANEL_ENABLED: "${IPPANEL_ENABLED:-false}"
      IPPANEL_BASE_URL: "${IPPANEL_BASE_URL:-https://edge.ippanel.com/v1}"
      IPPANEL_API_KEY: "${IPPANEL_API_KEY}"
      IPPANEL_SENDER: "${IPPANEL_SENDER}"
      IPPANEL_PATTERN_CODE: "${IPPANEL_PATTERN_CODE}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend/static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    # REL-02: pinned to the exact image running on prod 2026-11-20.
    # The live image is nginx:alpine (nginx 1.31.6, verified
    # `docker exec drup_frontend nginx -v`); the old repo tag
    # nginx:1.27-alpine was drift — it did not describe prod. Pin the
    # LIVE lineage (nginx:alpine@digest), never re-introduce 1.27.
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    container_name: drup_frontend
    restart: unless-stopped
    logging: *rel02-logging
    ports:
      - "80:80"
    volumes:
      - /opt/drup/dist:/usr/share/nginx/html:ro
      - /opt/drup/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
