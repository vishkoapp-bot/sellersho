# Bounded classes; no URI, identity, query, cookie or authorization in logs.
map $uri $telemetry_class {
    ~^/api/ api;
    ~^/static/ upload;
    ~*\.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ asset;
    default page;
}
log_format sellersho_telemetry escape=json '{"class":"$telemetry_class","status":$status,"duration_seconds":$request_time,"request_bytes":$request_length,"response_bytes":$body_bytes_sent,"backend_request_id":"$upstream_http_x_request_id"}';

# Private process/network counters. Scrape from this network namespace only.
# OBS-01 deploy-fix (2026-11-18): stub_status binds all interfaces
# INSIDE the frontend container (listen 8081). The old 127.0.0.1:8081
# bind was unreachable at the container's eth0 IP, and Docker publishing
# forwards exactly there, so the loopback-only host publish
# (127.0.0.1:8081:8081) could never reach it. Access stays restricted:
# host loopback (the exporter arriving via the publish) plus the
# platform docker network only; the endpoint is never proxied and the
# host publish stays 127.0.0.1-only.
server {
    listen 8081;
    access_log off;
    location = /status { stub_status; allow 127.0.0.1; allow 172.18.0.0/16; deny all; }
    location / { return 404; }
}

server {
    # Product-URL 301s (product-URL restructure, Oct 28, 2026):
    # old /product/<id-or-slug> -> canonical /product/spn-<n>/<slug>/.
    # map $uri is evaluated per request; a non-matching URI yields ""
    # and falls through to the SPA. $is_args$args preserves the query
    # string (?spnc= / ?variantId= / ad params) on the redirect.
    if ($product_redirect) {
        return 301 $product_redirect$is_args$args;
    }

    listen 80;
    access_log /dev/stdout sellersho_telemetry;
    server_name localhost;

    server_tokens off;

    # Caddy overwrites X-Forwarded-For. Only internal Docker proxies may
    # supply it; an internet client cannot choose the anti-fraud client IP.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Hashed assets - cache for 1 year (immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html - never cache (always fresh)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Frontend SPA routing
    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # Keep GET image collections on the ordinary budget. Named error routing
    # preserves the POST method/body while selecting the finite upload budget.
    location ~ ^/api/v1/(upload/product-image|supplier/products/[^/]+/(variants/[^/]+/)?images)$ {
        error_page 418 = @long_image_upload;
        if ($request_method = POST) { return 418; }
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        client_body_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 13s;
    }
    location @long_image_upload {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        client_body_timeout 60s;
        proxy_send_timeout 65s;
        proxy_read_timeout 68s;
    }

    # Proxy API requests to Go backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_request_buffering off;
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        client_body_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 13s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy static uploads to Go backend
    location /static/ {
        autoindex off;
        proxy_pass http://backend:8080/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
